name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes for this test build'
        required: false
        default: 'Sideload test build'

jobs:
  build-ipa:
    name: Build Sideloadable IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr piggytrunk.ipa Payload
          echo "IPA created successfully at build/ios/iphoneos/piggytrunk.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: piggytrunk-ios-ipa
          path: build/ios/iphoneos/piggytrunk.ipa
          retention-days: 14

